<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Oto Kita - Realtime Map</title>

    <!-- Favicon Links -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .h-screen-fix { height: calc(var(--vh, 1vh) * 100); }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; z-index: 1; background: #e5e3df; }
        .sidebar-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1500; }
        .basemap-card.active { border-color: #3b82f6; background-color: #eff6ff; color: #1e40af; }
        /* Atur z-index Leaflet Control agar di bawah Sidebar tapi di atas Map */
        .leaflet-control-container { z-index: 1000; }
    </style>
</head>
<body class="bg-gray-50 overflow-hidden h-screen-fix">

    <header class="h-16 bg-slate-900/95 backdrop-blur-sm text-white flex items-center justify-between px-4 z-[2000] fixed top-0 w-full shadow-lg">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="p-2 hover:bg-slate-800 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <h1 class="text-xl font-bold tracking-tight">Oto <span class="text-blue-400">Kita</span></h1>
        </div>
        <div class="flex items-center gap-2">
            <div id="user-info" class="hidden flex items-center gap-2 py-1 px-3 bg-slate-800 rounded-full border border-slate-700">
                <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                <span class="text-sm font-medium" id="display-name">Sopir</span>
                <button onclick="doLogout()" class="ml-1 p-1 text-red-400"><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </div>
            <button id="login-btn" onclick="toggleLoginModal()" class="py-1.5 px-4 bg-blue-600 rounded-full text-sm font-bold">Sopir</button>
        </div>
    </header>

    <!-- SIDEBAR: Default Tampil (translate-x-0) -->
    <aside id="sidebar" class="sidebar-transition fixed top-16 left-0 w-72 h-[calc(100%-64px)] bg-white/95 backdrop-blur-md border-r border-gray-200 shadow-2xl translate-x-0">
        <div class="p-4 space-y-6">
            <div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase mb-3">Layanan Utama</h3>
                <div class="space-y-2">
                    <button onclick="zoomToBus()" class="w-full flex items-center gap-3 p-3 bg-blue-50 text-blue-700 rounded-xl font-semibold border border-blue-100"><i data-lucide="bus" class="w-5 h-5"></i><span>Cari Bus Aktif</span></button>
                    <button onclick="iAmWaiting()" class="w-full flex items-center gap-3 p-3 bg-white text-gray-700 rounded-xl font-semibold border border-gray-200 shadow-sm"><i data-lucide="map-pin" class="w-5 h-5 text-red-500"></i><span>Tunggu Bus Disini</span></button>
                </div>
            </div>
            <hr class="border-gray-100">
            <div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase mb-3">Tampilan Peta</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="changeBasemap('osm')" id="btn-osm" class="basemap-card active p-2 border rounded-lg text-center font-bold text-[10px]">OSM</button>
                    <button onclick="changeBasemap('satelit')" id="btn-satelit" class="basemap-card p-2 border rounded-lg text-center font-bold text-[10px]">SATELIT</button>
                </div>
            </div>
        </div>
    </aside>

    <div id="map"></div>

    <!-- Right Bottom Controls -->
    <div class="absolute bottom-8 right-6 z-[1000] flex flex-col gap-3">
        <button onclick="goToMyLocation()" class="w-14 h-14 bg-white rounded-full shadow-2xl flex items-center justify-center border border-gray-100 text-blue-600 hover:scale-110 active:scale-95 transition">
            <i data-lucide="crosshair" class="w-7 h-7"></i>
        </button>
    </div>

    <div id="login-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[3000] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Mode Sopir</h2>
            <input type="text" id="bus-name-input" placeholder="Nama Bus (ex: Sinamar 01)" class="w-full p-3 border rounded-xl mb-4 outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex gap-2">
                <button onclick="toggleLoginModal()" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold">Batal</button>
                <button onclick="processLogin()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">Mulai Narik</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const SUPABASE_URL = 'https://cgkgxqpfwvnsjknrocwa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNna2d4cXBmd3Zuc2prbnJvY3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NzEwOTMsImV4cCI6MjEwNDI0NzA5M30.2K37gB7p3xSjsAw6c1L3kwmtT5bgTJ4ggEDcDQEfblk'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myLatLng = null, busMarkers = {}, passengerMarkers = {}, myMarker = null, watchId = null, wakeLock = null;

        const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OSM' });
        const satelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri' });

        // --- FIXED: ZOOM CONTROL ENABLED ---
        const map = L.map('map', { 
            zoomControl: false, // Matikan default
            layers: [osm], 
            tap: false 
        }).setView([-0.22, 100.63], 13);

        // Tambahkan zoom di bawah kiri agar tidak tertutup Sidebar
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        const baseMaps = { "osm": osm, "satelit": satelit };
        const busIcon = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png', iconSize: [35, 35], iconAnchor: [17, 17] });
        const waitIcon = L.icon({ iconUrl: 'favicon-32x32.png', iconSize: [24, 24], iconAnchor: [12, 12] });

        lucide.createIcons();
        function setVh() { document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`); }
        window.addEventListener('resize', setVh); setVh();

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('-translate-x-full');
        }

        function changeBasemap(key) {
            Object.values(baseMaps).forEach(layer => map.removeLayer(layer));
            baseMaps[key].addTo(map);
            document.querySelectorAll('.basemap-card').forEach(c => c.classList.remove('active'));
            document.getElementById('btn-' + key).classList.add('active');
        }

        function toggleLoginModal() { document.getElementById('login-modal').classList.toggle('hidden'); }

        async function processLogin() {
            const name = document.getElementById('bus-name-input').value;
            if(!name) return alert("Isi nama bus!");
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('display-name').innerText = name;
            toggleLoginModal();
            startDriverTracking(name);
        }

        function doLogout() { window.location.reload(); }

        function goToMyLocation() {
            if (myLatLng) map.flyTo(myLatLng, 16);
            else map.locate({setView: true, maxZoom: 16});
        }

        async function startDriverTracking(name) {
            if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
            watchId = navigator.geolocation.watchPosition(async (pos) => {
                const { latitude, longitude } = pos.coords;
                myLatLng = [latitude, longitude];
                map.panTo([latitude, longitude]);
                await supabaseClient.from('tracking_bus').upsert({ id: 1, nama_bus: name, lat: latitude, lng: longitude, last_update: new Date() });
            }, null, { enableHighAccuracy: true });
        }

        async function iAmWaiting() {
            if (!myLatLng) return alert("GPS belum nangkep lokasi lu!");
            const { error } = await supabaseClient.from('passenger_waiting').insert({ lat: myLatLng[0], lng: myLatLng[1] });
            if (!error) alert("Posisi nunggu lu udah muncul di peta!");
        }

        function renderBus(bus) {
            if (busMarkers[bus.id]) busMarkers[bus.id].setLatLng([bus.lat, bus.lng]);
            else busMarkers[bus.id] = L.marker([bus.lat, bus.lng], { icon: busIcon }).addTo(map).bindPopup(bus.nama_bus);
        }

        function renderPassenger(p) {
            if (!passengerMarkers[p.id]) passengerMarkers[p.id] = L.marker([p.lat, p.lng], { icon: waitIcon }).addTo(map);
        }

        function zoomToBus() {
            const ids = Object.keys(busMarkers);
            if(ids.length > 0) map.flyTo(busMarkers[ids[0]].getLatLng(), 15);
            else alert("Belum ada bus aktif!");
        }

        supabaseClient.channel('oto-v5').on('postgres_changes', { event: '*', schema: 'public', table: 'tracking_bus' }, payload => {
            if (payload.new) renderBus(payload.new);
        }).on('postgres_changes', { event: '*', schema: 'public', table: 'passenger_waiting' }, payload => {
            if (payload.new) renderPassenger(payload.new);
        }).subscribe();

        map.on('locationfound', (e) => {
            myLatLng = [e.latlng.lat, e.latlng.lng];
            if (!myMarker) myMarker = L.circleMarker(e.latlng, { radius: 8, fillColor: '#3b82f6', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
            else myMarker.setLatLng(e.latlng);
        });

        async function init() {
            const { data: b } = await supabaseClient.from('tracking_bus').select('*');
            if (b) b.forEach(renderBus);
            const { data: p } = await supabaseClient.from('passenger_waiting').select('*');
            if (p) p.forEach(renderPassenger);
            map.locate({setView: true, watch: true, maxZoom: 13});
        }
        init();
    </script>
</body>
</html>
