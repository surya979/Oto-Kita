<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Oto Kita V13.1 - Ultimate Crowdsourcing</title>

    <!-- Favicon Links -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .h-screen-fix { height: calc(var(--vh, 1vh) * 100); }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; z-index: 1; background: #e5e3df; }
        .sidebar-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1500; }
        .basemap-card.active { border-color: #3b82f6; background-color: #eff6ff; color: #1e40af; }
        #bus-info-card { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 4000; }
        .leaflet-control-container { z-index: 1000; }
        .leaflet-popup-content img { border-radius: 8px; margin-top: 8px; width: 100%; max-height: 150px; object-fit: cover; }
    </style>
</head>
<body class="bg-gray-50 overflow-hidden h-screen-fix">

    <!-- HEADER -->
    <header class="h-16 bg-blue-400/95 backdrop-blur-sm text-white flex items-center justify-between px-4 z-[2000] fixed top-0 w-full shadow-lg">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="p-2 hover:bg-slate-800 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
            <img src="logo.png" alt="Oto Kita" class="h-10 w-auto object-contain drop-shadow-md">
        </div>
        <div class="flex items-center gap-2">
            <div id="user-info" class="hidden flex items-center gap-2 py-1 px-3 bg-slate-800 rounded-full border border-slate-700">
                <div class="w-2 h-2 bg-green-500 rounded-full"></div>
                <span class="text-sm font-medium" id="display-name">Sopir</span>
                <button onclick="doLogout()" class="ml-1 p-1 text-red-400"><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </div>
            <button id="login-btn" onclick="toggleLoginModal()" class="py-1.5 px-4 bg-blue-600 rounded-full text-sm font-bold transition">Sopir</button>
        </div>
    </header>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="sidebar-transition fixed top-16 left-0 w-[70vw] max-w-[240px] h-[calc(100%-64px)] bg-white/95 backdrop-blur-md border-r border-gray-200 shadow-2xl translate-x-0">
        <div class="p-4 space-y-6">
            <div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase mb-3">Layanan Utama</h3>
                <div class="space-y-2">
                    <button onclick="zoomToBus()" class="w-full flex items-center gap-3 p-3 bg-blue-50 text-blue-700 rounded-xl font-semibold border border-blue-100"><i data-lucide="bus" class="w-5 h-5"></i><span>Cari Bus Aktif</span></button>
                    <button onclick="iAmWaiting()" class="w-full flex items-center gap-3 p-3 bg-white text-gray-700 rounded-xl font-semibold border border-gray-200 shadow-sm"><i data-lucide="map-pin" class="w-5 h-5 text-red-500"></i><span>Tunggu Bus Disini</span></button>
                    <!-- TEMA HIJAU (EMERALD) -->
                    <button onclick="toggleReportModal()" class="w-full flex items-center gap-3 p-3 bg-emerald-50 text-emerald-700 rounded-xl font-semibold border border-emerald-200 shadow-sm mt-4"><i data-lucide="camera" class="w-5 h-5"></i><span>Tambahkan Foto</span></button>
                </div>
            </div>
            <hr class="border-gray-100">
            <div>
                <h3 class="text-xs font-semibold text-gray-400 uppercase mb-3">Tampilan Peta</h3>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="changeBasemap('osm')" id="btn-osm" class="basemap-card active p-2 border rounded-lg text-center font-bold text-[10px]">Google</button>
                    <button onclick="changeBasemap('satelit')" id="btn-satelit" class="basemap-card p-2 border rounded-lg text-center font-bold text-[10px]">Hybrid</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- MAP -->
    <div id="map"></div>

    <!-- BOTTOM SHEET INFO -->
    <div id="bus-info-card" class="fixed bottom-0 left-0 right-0 p-4 translate-y-full">
        <div class="bg-white rounded-t-3xl shadow-2xl max-w-md mx-auto p-6">
            <div class="w-12 h-1.5 bg-gray-200 rounded-full mx-auto mb-4"></div>
            <div class="flex justify-between items-start mb-4 text-slate-800">
                <div>
                    <h2 id="card-bus-name" class="text-2xl font-bold">Nama Bus</h2>
                    <p class="text-green-500 text-sm font-semibold flex items-center gap-1">● Live (Snapped)</p>
                </div>
                <button onclick="closeBusCard()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x" class="w-5 h-5 text-gray-500"></i></button>
            </div>
            <div class="grid grid-cols-3 gap-2 border-t pt-4 text-center">
                <div><p class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">Jarak</p><p id="card-dist" class="font-bold text-blue-600">--</p></div>
                <div><p class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">Waktu</p><p id="card-eta" class="font-bold text-blue-600">--</p></div>
                <div><p class="text-[10px] text-gray-400 font-bold uppercase tracking-tighter">Laju</p><p id="card-speed" class="font-bold text-blue-600">--</p></div>
            </div>
        </div>
    </div>

    <!-- FLOAT BUTTON LOCATE -->
    <div class="absolute bottom-8 right-6 z-[1000] flex flex-col gap-3">
        <button onclick="goToMyLocation()" class="w-14 h-14 bg-white rounded-full shadow-2xl flex items-center justify-center border border-gray-100 text-blue-600 hover:scale-110 active:scale-95 transition">
            <i data-lucide="crosshair" class="w-7 h-7"></i>
        </button>
    </div>

    <!-- MODAL LOGIN -->
    <div id="login-modal" class="hidden fixed inset-0 bg-blue-400/60 backdrop-blur-sm z-[3000] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-slate-800">
            <h2 class="text-xl font-bold mb-4">Login Sopir</h2>
            <input type="text" id="bus-user-input" placeholder="Username (ex: Sinamar 01)" class="w-full p-3 border rounded-xl mb-2 outline-none focus:ring-2 focus:ring-blue-500">
            <input type="password" id="bus-pass-input" placeholder="Password" class="w-full p-3 border rounded-xl mb-4 outline-none focus:ring-2 focus:ring-blue-500">
            <div class="flex gap-2">
                <button onclick="toggleLoginModal()" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold">Batal</button>
                <button onclick="processLogin()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">Masuk</button>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH FOTO (V13.1 - KAMERA/GALERI) -->
    <div id="report-modal" class="hidden fixed inset-0 bg-blue-400/60 backdrop-blur-sm z-[3000] flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-slate-800">
            <h2 class="text-xl font-bold mb-2">Tambahkan Foto & Info</h2>
            <p class="text-xs text-gray-500 mb-4">Laporkan kondisi jalan, ban bocor, atau lokasi jemput.</p>
            
            <!-- Hidden Inputs -->
            <input type="file" id="photo-camera" accept="image/*" capture="environment" class="hidden" onchange="setPhoto(this)">
            <input type="file" id="photo-gallery" accept="image/*" class="hidden" onchange="setPhoto(this)">

            <!-- Tombol Kamera & Galeri -->
            <div class="flex gap-2 mb-1">
                <button onclick="document.getElementById('photo-camera').click()" class="flex-1 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 rounded-xl font-bold flex items-center justify-center gap-2 border border-emerald-200 transition">
                    <i data-lucide="camera" class="w-4 h-4"></i> Kamera
                </button>
                <button onclick="document.getElementById('photo-gallery').click()" class="flex-1 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-xl font-bold flex items-center justify-center gap-2 border border-blue-200 transition">
                    <i data-lucide="image" class="w-4 h-4"></i> Galeri
                </button>
            </div>
            
            <div id="photo-status" class="text-[10px] text-center text-gray-400 font-semibold mb-3">Belum ada foto dipilih</div>
            
            <textarea id="report-note" placeholder="Tulis keterangan di sini..." class="w-full p-3 border border-gray-200 rounded-xl mb-4 outline-none focus:ring-2 focus:ring-emerald-500 h-24 resize-none"></textarea>
            
            <div class="flex gap-2">
                <button onclick="toggleReportModal()" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold">Batal</button>
                <button id="btn-submit-report" onclick="submitReport()" class="flex-1 py-3 bg-emerald-500 text-white rounded-xl font-bold">Kirim Info</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- 1. CONFIG & GLOBALS ---
        const SUPABASE_URL = 'https://cgkgxqpfwvnsjknrocwa.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNna2d4cXBmd3Zuc2prbnJvY3dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2NzEwOTMsImV4cCI6MjEwNDI0NzA5M30.2K37gB7p3xSjsAw6c1L3kwmtT5bgTJ4ggEDcDQEfblk'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let myLatLng = null, myMarker = null, watchId = null, wakeLock = null;
        let busMarkers = {}, passengerMarkers = {}, reportMarkers = {};
        let passengerData = [], pickupTimers = {};
        
        let isFollowing = true; 
        let userRole = 'passenger';
        let lastPos = null, lastTime = null, speedHistory = [];
        let selectedPhotoFile = null;

        // --- 2. MAPS INITIALIZATION ---
        const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {maxZoom: 20,subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],attribution: '© Google Maps'});
        const googleHybrid = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {maxZoom: 20,subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],attribution: '© Google Maps'});

        const map = L.map('map', { zoomControl: false, layers: [googleStreets], tap: false }).setView([-0.22, 100.63], 13);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        map.on('dragstart', () => { isFollowing = false; closeBusCard(); });

        const baseMaps = { "osm": googleStreets, "satelit": googleHybrid };
        const busIcon = L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/3448/3448339.png', iconSize: [35, 35], iconAnchor: [17, 17] });
        const waitIcon = L.icon({ iconUrl: 'favicon-32x32.png', iconSize: [24, 24], iconAnchor: [12, 12] });
        
        // Ikon Report - Driver Kuning (#10b981 diubah ke Emerald Hijau biar senada sama UI), Penumpang Biru
        const driverReportIcon = L.divIcon({ className: 'custom-icon', html: `<svg fill="#D9C138" viewBox="0 0 24 24" width="30" height="30"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>`, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30] });
        const passReportIcon = L.divIcon({ className: 'custom-icon', html: `<svg fill="#10b981" viewBox="0 0 24 24" width="30" height="30"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>`, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30] });

        lucide.createIcons();
        function setVh() { document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`); }
        window.addEventListener('resize', setVh); setVh();

        // --- 3. UI LOGIC ---
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); }
        function toggleLoginModal() { document.getElementById('login-modal').classList.toggle('hidden'); }
        function toggleReportModal() { 
            document.getElementById('sidebar').classList.add('-translate-x-full'); 
            document.getElementById('report-modal').classList.toggle('hidden'); 
        }

        function changeBasemap(key) {
            Object.values(baseMaps).forEach(layer => map.removeLayer(layer));
            baseMaps[key].addTo(map);
            document.querySelectorAll('.basemap-card').forEach(c => c.classList.remove('active'));
            document.getElementById('btn-' + key).classList.add('active');
        }

        // --- 4. LOGIN SYSTEM ---
        async function processLogin() {
            const userInput = document.getElementById('bus-user-input').value.trim();
            const passInput = document.getElementById('bus-pass-input').value.trim();   
            
            const { data, error } = await supabaseClient.from('bus_accounts').select('*').eq('username', userInput).eq('password', passInput).single();

            if (data) {
                userRole = 'driver'; 
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('display-name').innerText = data.nama_bus;
                toggleLoginModal();
                startDriverTracking(data.nama_bus);
                if (myMarker) { map.removeLayer(myMarker); myMarker = null; }
                alert("Selamat datang, " + data.nama_bus + "!");
            } else {
                console.error(error);
                alert("Login gagal! Pastikan Username dan Password benar.");
            }
        }

        function doLogout() { userRole = 'passenger'; window.location.reload(); }

        // --- 5. GPS & TRACKING LOGIC ---
        function goToMyLocation() {
            isFollowing = true; 
            if (myLatLng) map.flyTo(myLatLng, 17);
            else map.locate({setView: true, maxZoom: 17});
        }

        function zoomToBus() {
            const busIds = Object.keys(busMarkers);
            if (busIds.length === 0) return alert("Belum ada bus yang aktif saat ini, cuy!");
            if (!myLatLng) return alert("Tunggu titik biru lokasi lu muncul dulu!");
            
            let closestBusId = null, minDistance = Infinity;
            busIds.forEach(id => {
                const dist = L.latLng(myLatLng[0], myLatLng[1]).distanceTo(busMarkers[id].getLatLng());
                if (dist < minDistance) { minDistance = dist; closestBusId = id; }
            });

            if (closestBusId) {
                isFollowing = false;
                map.flyTo(busMarkers[closestBusId].getLatLng(), 17, { animate: true, duration: 1.5 });
                busMarkers[closestBusId].fire('click');
            }
        }

        async function startDriverTracking(name) {
            if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e){} }
            watchId = navigator.geolocation.watchPosition(async (pos) => {
                const lat = pos.coords.latitude, lng = pos.coords.longitude;
                const speed = calculateSpeed(pos);
                myLatLng = [lat, lng];
                
                if (isFollowing) map.panTo(myLatLng);

                // Auto Pickup (30m radius, 30s delay)
                passengerData.forEach(async (p) => {
                    if (!p.is_picked_up && L.latLng([lat, lng]).distanceTo([p.lat, p.lng]) < 30) {
                        if (!pickupTimers[p.id]) {
                            pickupTimers[p.id] = setTimeout(async () => {
                                await supabaseClient.from('passenger_waiting').update({ is_picked_up: true }).eq('id', p.id);
                                delete pickupTimers[p.id];
                            }, 30000); 
                        }
                    } else if (pickupTimers[p.id]) {
                        clearTimeout(pickupTimers[p.id]); delete pickupTimers[p.id];
                    }
                });

                await supabaseClient.from('tracking_bus').upsert({ id: 1, nama_bus: name, lat: lat, lng: lng, speed: speed, last_update: new Date() });
            }, null, { enableHighAccuracy: true });
        }

        function calculateSpeed(pos) {
            const hwSpeed = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
            let mSpeed = 0;
            if (lastPos && lastTime) mSpeed = (L.latLng(lastPos).distanceTo([pos.coords.latitude, pos.coords.longitude]) / ((pos.timestamp - lastTime) / 1000)) * 3.6;
            lastPos = [pos.coords.latitude, pos.coords.longitude]; lastTime = pos.timestamp;
            let fSpeed = hwSpeed > 0 ? (hwSpeed * 0.7 + mSpeed * 0.3) : mSpeed;
            speedHistory.push(fSpeed > 120 ? 0 : fSpeed);
            if (speedHistory.length > 5) speedHistory.shift();
            return speedHistory.reduce((a, b) => a + b) / speedHistory.length;
        }

        // --- 6. RENDER DATA (BUS, PENUMPANG) ---
        async function snapToRoad(lat, lng) {
            try {
                const res = await fetch(`https://router.project-osrm.org/nearest/v1/driving/${lng},${lat}?number=1`);
                const data = await res.json();
                if (data.waypoints && data.waypoints.length > 0) return [data.waypoints[0].location[1], data.waypoints[0].location[0]];
            } catch (e) {} return [lat, lng];
        }

        async function renderBus(bus) {
            const snappedCoords = await snapToRoad(bus.lat, bus.lng);
            if (busMarkers[bus.id]) busMarkers[bus.id].setLatLng(snappedCoords);
            else {
                busMarkers[bus.id] = L.marker(snappedCoords, { icon: busIcon }).addTo(map);
                busMarkers[bus.id].on('click', () => openBusCard(bus));
            }
            if (!document.getElementById('bus-info-card').classList.contains('translate-y-full')) updateCardInfo(bus);
        }

        function openBusCard(bus) { isFollowing = false; updateCardInfo(bus); document.getElementById('bus-info-card').classList.remove('translate-y-full'); }
        function closeBusCard() { document.getElementById('bus-info-card').classList.add('translate-y-full'); }
        
        function updateCardInfo(bus) {
            document.getElementById('card-bus-name').innerText = bus.nama_bus;
            document.getElementById('card-speed').innerText = Math.round(bus.speed || 0) + " kmh";
            if (myLatLng) {
                const dist = (L.latLng(myLatLng).distanceTo([bus.lat, bus.lng]) / 1000).toFixed(1);
                document.getElementById('card-dist').innerText = dist + " km";
                document.getElementById('card-eta').innerText = Math.round((dist / (bus.speed > 5 ? bus.speed : 25)) * 60) + " mnt";
            }
        }

        function renderPassenger(p) {
            if (p.is_picked_up) {
                if (passengerMarkers[p.id]) { map.removeLayer(passengerMarkers[p.id]); delete passengerMarkers[p.id]; }
            } else if (!passengerMarkers[p.id]) passengerMarkers[p.id] = L.marker([p.lat, p.lng], { icon: waitIcon }).addTo(map);
        }

        async function iAmWaiting() {
            if (!myLatLng) return alert("GPS belum nangkep lokasi lu!");
            const { error } = await supabaseClient.from('passenger_waiting').insert({ lat: myLatLng[0], lng: myLatLng[1], is_picked_up: false });
            if (!error) alert("Sip! Posisi lu udah muncul di peta.");
        }

        // --- 7. FITUR CROWDSOURCING (FOTO) ---
        function setPhoto(input) {
            if (input.files && input.files[0]) {
                selectedPhotoFile = input.files[0];
                document.getElementById('photo-status').innerHTML = "✅ Foto siap: " + selectedPhotoFile.name.substring(0, 15) + "...";
                document.getElementById('photo-status').className = "text-xs text-center text-emerald-600 font-bold mb-3";
            }
        }

        function compressImage(file, maxSizeMB) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const scaleFactor = 800 / img.width;
                        canvas.width = 800; canvas.height = img.height * scaleFactor;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        async function submitReport() {
            if (!myLatLng) return alert("GPS belum aktif cuy!");
            const note = document.getElementById('report-note').value;
            const btn = document.getElementById('btn-submit-report');

            if (!selectedPhotoFile) return alert("Pilih fotonya dulu bos!");
            
            btn.innerText = "Mengunggah..."; btn.disabled = true;

            try {
                const base64Image = await compressImage(selectedPhotoFile, 1);
                const res = await fetch(base64Image);
                const blob = await res.blob();

                const fileName = `report_${Date.now()}.jpg`;
                const { error: uploadError } = await supabaseClient.storage.from('report_images').upload(fileName, blob);
                if (uploadError) throw uploadError;

                const { data: publicUrlData } = supabaseClient.storage.from('report_images').getPublicUrl(fileName);
                
                await supabaseClient.from('live_reports').insert({
                    role: userRole, lat: myLatLng[0], lng: myLatLng[1], note: note, image_url: publicUrlData.publicUrl
                });

                alert("Laporan berhasil dikirim!");
                toggleReportModal();
                
                // Reset Form
                document.getElementById('report-note').value = ''; 
                selectedPhotoFile = null;
                document.getElementById('photo-camera').value = '';
                document.getElementById('photo-gallery').value = '';
                document.getElementById('photo-status').innerHTML = "Belum ada foto dipilih";
                document.getElementById('photo-status').className = "text-[10px] text-center text-gray-400 font-semibold mb-3";
            } catch (err) { alert("Gagal kirim: " + err.message); } 
            finally { btn.innerText = "Kirim Info"; btn.disabled = false; }
        }

        function renderReport(r) {
            if (!reportMarkers[r.id]) {
                const icon = r.role === 'driver' ? driverReportIcon : passReportIcon;
                const marker = L.marker([r.lat, r.lng], { icon: icon }).addTo(map);
                const popupContent = `
                    <div style="text-align:center; min-width:150px;">
                        <b style="color:${r.role === 'driver' ? '#10b981' : '#3b82f6'}; font-size:14px;">Info ${r.role === 'driver' ? 'Sopir' : 'Penumpang'}</b>
                        <p style="margin:4px 0; font-size:12px;">"${r.note}"</p>
                        ${r.image_url ? `<img src="${r.image_url}" alt="Report">` : ''}
                    </div>
                `;
                marker.bindPopup(popupContent);
                reportMarkers[r.id] = marker;
            }
        }

        // --- 8. INIT & REALTIME SYNC ---
        supabaseClient.channel('oto-v13').on('postgres_changes', { event: '*', schema: 'public', table: 'tracking_bus' }, payload => {
            if (payload.new) renderBus(payload.new);
        }).on('postgres_changes', { event: '*', schema: 'public', table: 'passenger_waiting' }, payload => {
            if (payload.new) {
                renderPassenger(payload.new);
                const idx = passengerData.findIndex(x => x.id === payload.new.id);
                if(idx > -1) passengerData[idx] = payload.new; else passengerData.push(payload.new);
            }
        }).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'live_reports' }, payload => {
            if (payload.new) renderReport(payload.new);
        }).subscribe();

        map.on('locationfound', (e) => {
            myLatLng = [e.latlng.lat, e.latlng.lng];
            if (userRole === 'passenger') {
                if (!myMarker) myMarker = L.circleMarker(e.latlng, { radius: 8, fillColor: '#3b82f6', color: '#fff', weight: 3, fillOpacity: 1 }).addTo(map);
                else myMarker.setLatLng(e.latlng);
            } else if (myMarker) { map.removeLayer(myMarker); myMarker = null; }
            
            if (isFollowing) map.panTo(e.latlng);
        });

        async function init() {
            const { data: b } = await supabaseClient.from('tracking_bus').select('*');
            if (b) b.forEach(renderBus);
            const { data: p } = await supabaseClient.from('passenger_waiting').select('*').eq('is_picked_up', false);
            if (p) { passengerData = p; p.forEach(renderPassenger); }
            const { data: r } = await supabaseClient.from('live_reports').select('*');
            if (r) r.forEach(renderReport);
            map.locate({watch: true, enableHighAccuracy: true});
        }
        init();
    </script>
</body>
</html>
